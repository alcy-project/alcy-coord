name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Release (${{ matrix.plat }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        cc: [clang]
        cxx: [clang++]
        os:
          - ubuntu-24.04
          - macos-26
          - windows-2025-vs2026
        include:
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            stdlib: libc++
            archive: tar.gz
          - os: macos-26
            plat: macosx
            arch: arm64
            stdlib: libc++
            archive: tar.gz
          - os: windows-2025-vs2026
            plat: windows
            arch: x64
            stdlib: msvc
            archive: zip
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      COLORTERM: 256color
      XMAKE_COLORTERM: 256color
      XMAKE_ROOT: y
      basename: "alcy"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup build environment
        uses: ./.github/actions/setup
        with:
          os: ${{ runner.os }}
          plat: ${{ matrix.plat }}
          arch: ${{ matrix.arch }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      - name: Configure
        shell: bash
        run: |
          xmake config -c -y \
            -m release \
            --toolchain=clang \
            --unitybuild=y \
            --llvm=y \
            --cache-llvm=y \
            --download-llvm=y \
            --build-llvm=n \
            --lto=y \
            --stdlib="${{ matrix.stdlib }}" \
            -p "${{ matrix.plat }}" \
            -a "${{ matrix.arch }}"

      - name: Build
        shell: bash
        run: |
          xmake build -w

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.plat }}-${{ matrix.arch }}
          path: build/${{ matrix.plat }}/${{ matrix.arch }}/**

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp LICENSE README.md dist/
          cp build/${{ matrix.plat }}/${{ matrix.arch }}/**/${{ env.basename }}* dist/
          if [[ "${{ matrix.plat }}" == "windows" ]]; then
            cd dist && 7z a ../${{ env.basename }}-${{ matrix.plat }}-${{ matrix.arch }}.zip *
          else
            cd dist && tar -czvf ../${{ env.basename }}-${{ matrix.plat }}-${{ matrix.arch }}.tar.gz *
          fi

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: ${{ env.basename }}-${{ matrix.plat }}-${{ matrix.arch }}.${{ matrix.archive }}
          draft: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
