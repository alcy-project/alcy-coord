name: ci

on:
  push:
    branches: [main]
    paths: &ci_paths
      - src/**
      - tests/**
      - benchmarks/**
      - third_party/**
      - scripts/**
      - .github/workflows/ci.yml
      - xmake.lua
      - .clang-tidy
      - CPPLINT.cfg
      - uv.lock
  pull_request:
    branches: [main]
    paths: *ci_paths
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            plat: linux
            arch: x86_64
            cc: clang
            cxx: clang++
            stdlib: libc++
            sanitizers: y
            libunwind: y
          - os: windows-2025-vs2026
            plat: windows
            arch: x64
            cc: clang
            cxx: clang++
            stdlib: msvc
            sanitizers: n
            libunwind: n
          - os: macos-26
            plat: macosx
            arch: arm64
            cc: clang
            cxx: clang++
            stdlib: libc++
            sanitizers: n
            libunwind: n
    runs-on: ${{ matrix.os }}
    name: Build and test (${{ matrix.plat }}-${{ matrix.arch }})
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      COLORTERM: 256color
      XMAKE_COLORTERM: 256color
      XMAKE_ROOT: y
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup build environment
        uses: ./.github/actions/setup
        with:
          os: ${{ runner.os }}
          plat: ${{ matrix.plat }}
          arch: ${{ matrix.arch }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      - name: Configure
        shell: bash
        run: |
          xmake config -y \
            -m debug \
            --tests=y \
            --benchmarks=y \
            --toolchain=llvm \
            --fmtlib=y \
            --llvm=y \
            --stdlib="${{ matrix.stdlib }}" \
            --sanitizers="${{ matrix.sanitizers }}" \
            --libunwind="${{ matrix.libunwind }}" \
            -p "${{ matrix.plat }}" \
            -a "${{ matrix.arch }}"

      - name: Build
        shell: bash
        run: |
          ccache -z
          xmake build -w
          ccache -s

      - name: Build tests and run
        shell: bash
        run: xmake run tests

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.plat }}-${{ matrix.arch }}
          path: build/${{ matrix.plat }}/${{ matrix.arch }}/**

      - name: Analyze statically
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xmake check api
          xmake check clang
          xmake lint
